
name: Build AWAKEN

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix executable permissions
        run: |
          chmod +x gradlew
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | bash "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit Tests
        run: |
          bash ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          bash ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK"
          echo "APK FOUND: $APK"
          ls -lh "$APK"

      - name: Upload AWAKEN APK
        uses: actions/upload-artifact@v4
        with:
          name: awaken-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awaken-build-logs
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
